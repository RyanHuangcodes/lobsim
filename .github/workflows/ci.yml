name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test (${{ matrix.compiler }}, ${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        include:
          - compiler: gcc
            cc: gcc-14
            cxx: g++-14
          - compiler: clang
            cc: clang-18
            cxx: clang++-18
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DLOBSIM_WERROR=ON
      - name: Build
        run: cmake --build build -j "$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure -j "$(nproc)"

  sanitize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DLOBSIM_WERROR=ON
          -DLOBSIM_SANITIZE=ON
      - name: Build
        run: cmake --build build -j "$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure -j "$(nproc)"

  fuzz-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang-18 llvm-18 libclang-rt-18-dev
      - name: Configure
        run: >
          cmake -S . -B build-fuzz
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DLOBSIM_FUZZ=ON
      - name: Build
        run: cmake --build build-fuzz -j "$(nproc)"
      - name: Check that the engine and the parser are instrumented
        run: |
          for lib in build-fuzz/liblob.a build-fuzz/liborderlog.a build-fuzz/libreplay.a; do
            n=$(nm "$lib" | grep -c __sanitizer_cov || true)
            echo "$lib: $n __sanitizer_cov references"
            if [ "$n" -eq 0 ]; then
              echo "FAIL: $lib has no fuzzer instrumentation"
              exit 1
            fi
          done
      - name: Fuzz diff (60 s)
        run: |
          mkdir -p fuzz-work/diff fuzz-artifacts
          ./build-fuzz/fuzz/fuzz_diff fuzz-work/diff fuzz/corpus/diff \
            -max_len=4096 -max_total_time=60 -timeout=10 \
            -artifact_prefix=fuzz-artifacts/ -print_final_stats=1
      - name: Fuzz book-builder operations (60 s)
        run: |
          mkdir -p fuzz-work/diff_builder fuzz-artifacts
          ./build-fuzz/fuzz/fuzz_diff_builder fuzz-work/diff_builder fuzz/corpus/diff_builder \
            -max_len=4096 -max_total_time=60 -timeout=10 \
            -artifact_prefix=fuzz-artifacts/ -print_final_stats=1
      - name: Fuzz replay parser (60 s)
        run: |
          mkdir -p fuzz-work/replay_parse fuzz-artifacts
          ./build-fuzz/fuzz/fuzz_replay_parse fuzz-work/replay_parse fuzz/corpus/replay_parse \
            -max_len=4096 -max_total_time=60 -timeout=10 \
            -artifact_prefix=fuzz-artifacts/ -print_final_stats=1
      - name: Fuzz LOBSTER parsers (60 s)
        run: |
          mkdir -p fuzz-work/lobster_parse fuzz-artifacts
          ./build-fuzz/fuzz/fuzz_lobster_parse fuzz-work/lobster_parse fuzz/corpus/lobster_parse \
            -max_len=4096 -max_total_time=60 -timeout=10 \
            -artifact_prefix=fuzz-artifacts/ -print_final_stats=1
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-smoke-artifacts
          path: fuzz-artifacts/
          if-no-files-found: ignore
      - name: Fuzz ITCH feed parser (60 s)
        run: |
          n=$(nm build-fuzz/libfeed.a | grep -c __sanitizer_cov || true)
          echo "build-fuzz/libfeed.a: $n __sanitizer_cov references"
          if [ "$n" -eq 0 ]; then
            echo "FAIL: build-fuzz/libfeed.a has no fuzzer instrumentation"
            exit 1
          fi
          mkdir -p fuzz-work/feed_parse fuzz-artifacts-feed
          ./build-fuzz/fuzz/fuzz_feed_parse fuzz-work/feed_parse fuzz/corpus/feed_parse \
            -max_len=70000 -max_total_time=60 -timeout=10 \
            -artifact_prefix=fuzz-artifacts-feed/ -print_final_stats=1
      - name: Upload feed parser crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-smoke-feed-artifacts
          path: fuzz-artifacts-feed/
          if-no-files-found: ignore

  fuzz-canary:
    name: fuzz-canary (${{ matrix.bug }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        bug:
          - LOBSIM_BUG_TAKER_PRICE
          - LOBSIM_BUG_MODIFY_KEEPS_PRIORITY
          - LOBSIM_BUG_FOK_IGNORES_STP
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang-18 llvm-18 libclang-rt-18-dev
      - name: Configure
        run: >
          cmake -S . -B build-fuzz
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DLOBSIM_FUZZ=ON
          -DLOBSIM_INJECT_BUG=${{ matrix.bug }}
      - name: Build
        run: cmake --build build-fuzz -j "$(nproc)"
      - name: Check that the engine and the parser are instrumented
        run: |
          for lib in build-fuzz/liblob.a build-fuzz/liborderlog.a; do
            n=$(nm "$lib" | grep -c __sanitizer_cov || true)
            echo "$lib: $n __sanitizer_cov references"
            if [ "$n" -eq 0 ]; then
              echo "FAIL: $lib has no fuzzer instrumentation"
              exit 1
            fi
          done
      - name: Fuzz must find the injected bug
        run: |
          mkdir -p fuzz-work/diff fuzz-artifacts
          start=$SECONDS
          set +e
          ./build-fuzz/fuzz/fuzz_diff fuzz-work/diff fuzz/corpus/diff \
            -max_len=4096 -max_total_time=300 -timeout=10 \
            -artifact_prefix=fuzz-artifacts/ -print_final_stats=1
          rc=$?
          set -e
          elapsed=$((SECONDS - start))
          crash=""
          for f in fuzz-artifacts/crash-*; do
            if [ -e "$f" ]; then crash=$f; break; fi
          done
          if [ "$rc" -ne 0 ] && [ -n "$crash" ]; then
            echo "PASS: ${{ matrix.bug }} found after ${elapsed}s, crash file: $(basename "$crash")"
          else
            echo "FAIL: ${{ matrix.bug }} not detected (exit code $rc, ${elapsed}s, no crash file)"
            exit 1
          fi
      - name: Fuzz must find the injected bug without seeds
        run: |
          mkdir -p fuzz-work-unseeded fuzz-empty fuzz-artifacts-unseeded
          start=$SECONDS
          set +e
          ./build-fuzz/fuzz/fuzz_diff fuzz-work-unseeded fuzz-empty \
            -max_len=4096 -max_total_time=120 -timeout=10 \
            -artifact_prefix=fuzz-artifacts-unseeded/ -print_final_stats=1
          rc=$?
          set -e
          elapsed=$((SECONDS - start))
          crash=""
          for f in fuzz-artifacts-unseeded/crash-*; do
            if [ -e "$f" ]; then crash=$f; break; fi
          done
          if [ "$rc" -ne 0 ] && [ -n "$crash" ]; then
            echo "PASS (unseeded): ${{ matrix.bug }} found after ${elapsed}s, crash file: $(basename "$crash")"
          else
            echo "FAIL (unseeded): ${{ matrix.bug }} not detected (exit code $rc, ${elapsed}s, no crash file)"
            exit 1
          fi
      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-canary-${{ matrix.bug }}
          path: fuzz-artifacts/
          if-no-files-found: ignore
      - name: Upload unseeded crash artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-canary-unseeded-${{ matrix.bug }}
          path: fuzz-artifacts-unseeded/
          if-no-files-found: ignore

  replay-canary:
    name: replay-canary (${{ matrix.bug }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        bug:
          - DIRECTION_IS_AGGRESSOR
          - APPLY_HIDDEN
          - NO_SEED
    steps:
      - uses: actions/checkout@v7
      # The closed-loop export comes from a normal build: the canary build holds only lob, replay and
      # lobsim_lobster. The simulator emits no hidden executions, so APPLY_HIDDEN is checked on the
      # hand-written fixtures only.
      - name: Export a closed-loop run (normal build)
        if: matrix.bug != 'APPLY_HIDDEN'
        run: |
          cmake -S . -B build-normal -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14
          cmake --build build-normal -j "$(nproc)" --target lobsim_run lobsim_export_lobster lobsim_lobster
          build-normal/lobsim_run --config configs/default.json --seed 7 --duration-s 60 --out closed-loop/run
          build-normal/lobsim_export_lobster --run closed-loop/run --levels 10 --out closed-loop/lobster
      - name: Configure the canary build
        run: >
          cmake -S . -B build-replay-canary
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=gcc-14
          -DCMAKE_CXX_COMPILER=g++-14
          -DLOBSIM_WERROR=ON
          -DLOBSIM_REPLAY_BUG=${{ matrix.bug }}
      - name: Build
        run: cmake --build build-replay-canary -j "$(nproc)"
      - name: Fixture replays must fail with exit code 2
        run: ctest --test-dir build-replay-canary --output-on-failure --no-tests=error -V
      - name: Control, no bug - the closed-loop replay must be exact (exit code 0)
        if: matrix.bug != 'APPLY_HIDDEN'
        run: |
          set +e
          build-normal/lobsim_lobster \
            --messages closed-loop/lobster/SIM_2012-06-21_34200000_57600000_message_10.csv \
            --orderbook closed-loop/lobster/SIM_2012-06-21_34200000_57600000_orderbook_10.csv \
            --mode strict --compare-depth 10 > /dev/null
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "FAIL: the normal build exited with $rc on the closed-loop export; a broken export would look like a caught bug"
            exit 1
          fi
          echo "PASS: the normal build replays the closed-loop export exactly (exit code 0)"
      - name: Closed-loop replay must fail with exit code 2
        if: matrix.bug != 'APPLY_HIDDEN'
        run: >
          cmake -DLOBSTER=build-replay-canary/lobsim_lobster
          -DMESSAGES=closed-loop/lobster/SIM_2012-06-21_34200000_57600000_message_10.csv
          -DORDERBOOK=closed-loop/lobster/SIM_2012-06-21_34200000_57600000_orderbook_10.csv
          -DLABEL=${{ matrix.bug }}/closed-loop
          -DOUT=closed-loop-replay
          -P tests/replay_canary_check.cmake

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang-18 llvm-18
      - name: Configure
        run: >
          cmake -S . -B build-cov
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_CXX_FLAGS="-fprofile-instr-generate -fcoverage-mapping"
          -DCMAKE_EXE_LINKER_FLAGS=-fprofile-instr-generate
      - name: Build
        run: cmake --build build-cov -j "$(nproc)"
      - name: Test with profiling
        run: |
          mkdir -p prof
          LLVM_PROFILE_FILE="$PWD/prof/%p-%m.profraw" \
            ctest --test-dir build-cov --output-on-failure -j "$(nproc)"
      - name: Coverage report
        run: |
          llvm-profdata-18 merge -sparse prof/*.profraw -o lobsim.profdata
          exes=()
          for name in lob_tests sim_tests replay_tests fuzz_diff fuzz_regression_tests fuzz_decode_tests lobsim_run lobsim_replay lobsim_lobster lobsim_export_lobster lobsim_bench; do
            if [ -x "build-cov/$name" ]; then
              exes+=("build-cov/$name")
            else
              echo "missing test executable: build-cov/$name"
            fi
          done
          if [ "${#exes[@]}" -eq 0 ]; then
            echo "no test executables found"
            exit 1
          fi
          args=("${exes[0]}")
          for exe in "${exes[@]:1}"; do
            args+=("-object" "$exe")
          done
          ignore='(_deps|tests|src/sim|include/sim|apps|bench|fuzz)/|^/usr/'
          llvm-cov-18 report "${args[@]}" -instr-profile=lobsim.profdata \
            -ignore-filename-regex="$ignore" | tee cov-report.txt
          awk '/src\/lob/ { total += $8; missed += $9 }
               END { if (total > 0) printf "src/lob line coverage: %.2f%%\n", 100 * (total - missed) / total
                     else print "src/lob line coverage: n/a" }' cov-report.txt
          llvm-cov-18 show "${args[@]}" -instr-profile=lobsim.profdata \
            -ignore-filename-regex="$ignore" -format=html -output-dir=cov-html
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: cov-html
          path: cov-html/

  # The binary feed (upgrade 6): the encoder built with LOBSIM_FEED_BUG=add_before_exec publishes a
  # taker's A before its executions, and the book rebuilt from the feed must refuse it (exit code 2 on
  # the exporter fixture, a crossing-A mismatch in the differential stream). The normal build is the
  # control: the same inputs, and a closed-loop run, must check clean.
  feed-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Configure the canary build
        run: >
          cmake -S . -B build-feed-canary
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=gcc-14
          -DCMAKE_CXX_COMPILER=g++-14
          -DLOBSIM_WERROR=ON
          -DLOBSIM_FEED_BUG=add_before_exec
      - name: Build the canary
        run: cmake --build build-feed-canary -j "$(nproc)"
      - name: The bug must be caught (lobsim_feed check exits 2, the differential stream stops on the feed)
        run: ctest --test-dir build-feed-canary --output-on-failure --no-tests=error -V
      - name: Control, no bug - the same inputs and a closed-loop run must check clean (exit code 0)
        run: |
          cmake -S . -B build-normal -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14
          cmake --build build-normal -j "$(nproc)" --target lobsim_run lobsim_feed fuzz_diff
          build-normal/lobsim_feed check --run tests/fixtures/lobster_export
          build-normal/fuzz_diff --seed 1 --messages 10000
          build-normal/lobsim_run --config configs/default.json --seed 7 --duration-s 60 --out closed-loop/run
          build-normal/lobsim_feed check --run closed-loop/run

name: pages

# Publish the lobsim replay dashboard to GitHub Pages. Separate from ci.yml so that workflow stays
# untouched. Deploys only run from the default branch, so nothing publishes until upgrade/dashboard
# is merged into main. See DASHBOARD.md for the one-time Settings -> Pages setup.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege at the top level; the deploy job widens its own permissions below.
permissions:
  contents: read

# Standard Pages concurrency: let an in-flight deploy finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build the site (Release build + 1-hour seed-42 demo run + export + web assets)
        run: bash scripts/build_site.sh
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload the site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

name: pages

# Publish the lobsim replay dashboard to GitHub Pages. Separate from ci.yml so that workflow stays
# untouched. Deploys only run from the default branch. Pull requests run the build job only, so a
# change that breaks the site build fails the pull request, not main. See DASHBOARD.md for the
# one-time Settings -> Pages setup.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege at the top level; the deploy job widens its own permissions below. The actions
# are pinned to commit SHAs (the release in the comment), because this workflow can publish the
# site; Dependabot keeps the pins current (.github/dependabot.yml).
permissions:
  contents: read

# Standard Pages concurrency: let an in-flight deploy finish rather than cancelling it. Each ref has
# its own group, so a pull request never queues behind or replaces a deploy of main; a new push to a
# pull request cancels that pull request's older build.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build the site (Release build + 1-hour seed-42 demo run + export + web assets)
        run: bash scripts/build_site.sh
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload the site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    # Only main publishes, also for a manual run started from another branch (D-910).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
